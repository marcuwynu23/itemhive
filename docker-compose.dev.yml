# =============================================================================
# ItemHive Development Docker Compose Configuration
# =============================================================================
# Optimized for development with hot reloading and debugging

version: '3.8'

services:
  # =============================================================================
  # MongoDB Database Service (Development)
  # =============================================================================
  mongodb:
    image: mongo:7.0
    container_name: itemhive-mongodb-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: devpassword
      MONGO_INITDB_DATABASE: itemhive_dev
    ports:
      - "27017:27017"
    volumes:
      - mongodb_dev_data:/data/db
    networks:
      - itemhive-dev-network

  # =============================================================================
  # ItemHive Development Service
  # =============================================================================
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    container_name: itemhive-app-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=mongodb://admin:devpassword@mongodb:27017/itemhive_dev?authSource=admin
      - MONGODB_URI=mongodb://admin:devpassword@mongodb:27017/itemhive_dev?authSource=admin
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=dev-secret-key-not-for-production
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
    depends_on:
      - mongodb
    networks:
      - itemhive-dev-network
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

  # =============================================================================
  # MongoDB Admin Interface (Development)
  # =============================================================================
  mongo-express:
    image: mongo-express:1.0.0
    container_name: itemhive-mongo-express-dev
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: devpassword
      ME_CONFIG_MONGODB_URL: mongodb://admin:devpassword@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      - mongodb
    networks:
      - itemhive-dev-network

# =============================================================================
# Networks
# =============================================================================
networks:
  itemhive-dev-network:
    driver: bridge
    name: itemhive-dev-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  mongodb_dev_data:
    driver: local
    name: itemhive-mongodb-dev-data